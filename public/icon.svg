<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ecg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  
  <!-- ECG Grid Background -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="80" y1="120" x2="432" y2="120"/>
    <line x1="80" y1="170" x2="432" y2="170"/>
    <line x1="80" y1="220" x2="432" y2="220"/>
    <line x1="80" y1="270" x2="432" y2="270"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="80" y1="370" x2="432" y2="370"/>
    <line x1="130" y1="80" x2="130" y2="432"/>
    <line x1="180" y1="80" x2="180" y2="432"/>
    <line x1="230" y1="80" x2="230" y2="432"/>
    <line x1="280" y1="80" x2="280" y2="432"/>
    <line x1="330" y1="80" x2="330" y2="432"/>
    <line x1="380" y1="80" x2="380" y2="432"/>
  </g>

  <!-- Heart Background Contour -->
  <path d="M256 160 C230 110, 160 110, 130 160 C90 230, 180 310, 256 380 C332 310, 422 230, 382 160 C352 110, 282 110, 256 160 Z" 
        fill="none" stroke="#e11d48" stroke-width="8" opacity="0.2"/>

  <!-- Crisp 12-Lead ECG Waveform with QRS Complex and T Wave -->
  <path d="M60 270 L130 270 Q145 270 155 255 Q165 240 175 270 L195 270 L210 300 L240 120 L270 370 L295 270 L320 270 Q345 220 370 270 L452 270" 
        fill="none" stroke="url(#ecg)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Caliper points indicator -->
  <circle cx="240" cy="120" r="8" fill="#38bdf8"/>
  <circle cx="270" cy="370" r="8" fill="#f43f5e"/>
</svg>
